[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evkit"
version = "0.0.1"
description = "Scientific toolkit built across Phase 0 of escape-velocity"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[project.scripts]
ev = "evkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
